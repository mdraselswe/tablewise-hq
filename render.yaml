# Render Blueprint: one Docker web service (API + web app) and a managed PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
#
# Notes for the hosted demo:
# - Free web services sleep after 15 minutes without traffic; the first request
#   after that takes about a minute while the container starts.
# - Free Render PostgreSQL databases expire 30 days after creation. For a longer-lived
#   demo, point DATABASE_URL at Neon or Supabase instead (and set DATABASE_SSL=true).
services:
  - type: web
    name: tablewise-hq
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tablewise-db
          property: connectionString
      # Internal network connection, no TLS needed.
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      # Render terminates TLS at its proxy: trust X-Forwarded-* for secure cookies and client IPs.
      - key: TRUST_PROXY
        value: "true"
      # Fill an empty database with demo outlets, menu, users and two weeks of sales.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_LEVEL
        value: info

databases:
  - name: tablewise-db
    plan: free
    region: singapore
    databaseName: tablewise
    user: tablewise
