# Render Blueprint: one Docker web service that runs the API and serves the web app.
# The database is Neon (serverless PostgreSQL), which unlike Render's free PostgreSQL
# does not expire after 30 days.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. Render asks for
# DATABASE_URL: paste Neon's *direct* connection string (host without "-pooler").
# The app holds a LISTEN connection for live updates, which a transaction-mode pooler
# would break.
#
# Free web services sleep after 15 minutes without traffic; the first request after
# that waits while the container starts.
services:
  - type: web
    name: tablewise-hq
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # Secret: entered in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # Neon accepts TLS connections only.
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      # Render terminates TLS at its proxy: trust X-Forwarded-* for secure cookies and client IPs.
      - key: TRUST_PROXY
        value: "true"
      # Fill an empty database with demo outlets, menu, users and two weeks of sales.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_LEVEL
        value: info
